# gitleaks allowlist for this template repository. The copy under template/ is
# the one a generated repo gets. Consumed by GitLab's secret_detection job via
# the passthrough in `.gitlab/secret-detection-ruleset.toml`.

title = "template allowlist"

[extend]
# CRITICAL: useDefault = true is required. Without it gitleaks loads only this
# file's rules (none) and all secret detection is disabled.
useDefault = true

[[allowlists]]
description = "known false positives"
regexes = [
  # 1Password reference URIs — pointers to vault items, not secrets.
  '''op://[A-Za-z0-9_ /-]+''',
  # Documentation placeholders like [your-api-key].
  '''\[your-[a-z0-9-]+\]''',
  # Test/fixture tokens — anchored so a real secret can't hide behind the prefix.
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
]
