# gitleaks allowlist for this template repository.
#
# Consumed by GitLab's secret_detection job (gitleaks under the hood) via the
# passthrough in `.gitlab/secret-detection-ruleset.toml`. The copy under
# template/ is the one a generated repo gets.
#
# `useDefault = true` is REQUIRED — without it gitleaks loads only the rules in
# this file (none), disabling all detection. The allowlist below only silences
# obvious non-secrets (1Password references, doc placeholders, anchored
# test/fake fixtures); every real detector still runs.

title = "template allowlist"

[extend]
useDefault = true

[[allowlists]]
description = "known false positives"
regexes = [
  # 1Password reference URIs — pointers to vault items, not secrets.
  '''op://[A-Za-z0-9_ /-]+''',
  # Documentation placeholders like [your-api-key].
  '''\[your-[a-z0-9-]+\]''',
  # Test/fixture tokens — anchored so a real secret can't hide behind the prefix.
  '''^(test|fake|dummy|example)[-_]?(password|token|key|secret)[A-Za-z0-9_-]*''',
]
