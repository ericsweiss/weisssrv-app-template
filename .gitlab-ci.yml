---
# CI for a weisssrv cluster tenant repo.
#
# The generic lint / validate / security jobs are NOT defined here — they are
# pulled from the shared library `eric/weisssrv-lib` at a pinned release tag, so
# a tooling/version change is made once in the library and every consumer picks
# it up by bumping the ref. See docs/CONSUMING.md for the full story and
# https://git.ericsweiss.com/eric/weisssrv-lib/-/blob/main/docs/INCLUDE-CONTRACT.md
# for each template's inputs.
#
# Runner: this pipeline is deliberately TAG-LESS (every include passes
# `tags: []`) so it lands on weisssrv's shared, NON-privileged `k8s-deploy`
# runner. That runner's egress is firewalled to the internet only — lint,
# kubeconform, secret scanning and the container registry all work; there is NO
# LAN/tailnet access, NO SSH, and NO Docker-in-Docker. Deploys happen through
# Flux (git is the source of truth), never a CI `kubectl apply`.
#
# Bumping the library: change every `ref:` below to the new tag in one MR (there
# is no hosted Renovate — bumps are deliberate). See docs/CONSUMING.md.
stages:
  - build       # only the OPTIONAL image build lands here (see the include below)
  - lint
  - validate    # only the OPTIONAL terraform validate lands here
  - security
  - ai-review

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ============================================================================
# Shared library templates (include:project + inputs). Every job is the tenant
# profile: `tags: []` (shared runner) and the non-root-safe input set.
# ============================================================================
include:
  # -- yaml-lint: lint the whole tree against the repo-local .yamllint --------
  - project: eric/weisssrv-lib
    ref: v0.1.0
    file: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      config: "-c .yamllint"
      targets: "."
      changes:
        - "**/*.yaml"
        - "**/*.yml"
        - ".yamllint"

  # -- flux-lint: kustomize build + kubeconform (SIMPLE mode) ----------------
  # substitute: false — a tenant has no cluster-versions ConfigMap and pins
  # literal image tags, so there is nothing to envsubst. The tool versions
  # (kubeconform / kustomize) and the kubeconform target k8s version are OWNED
  # by the library's defaults on purpose — do not re-pin them here; bump the
  # library ref to move them (removes the drift this template used to carry).
  - project: eric/weisssrv-lib
    ref: v0.1.0
    file: /ci/validate/flux-lint.yml
    inputs:
      tags: []
      substitute: false
      changes:
        - "kubernetes/**/*"

  # -- shellcheck: lint the scripts/ helpers (the rename wrapper) -------------
  - project: eric/weisssrv-lib
    ref: v0.1.0
    file: /ci/lint/shellcheck.yml
    inputs:
      tags: []
      direct_globs: "scripts/*.sh"
      find_dir: ""          # no ansible role tree in a tenant repo
      changes:
        - "scripts/**/*"

  # -- docs-link-check: relative Markdown cross-links resolve -----------------
  # Runs the vendored, stdlib-only scripts/check-doc-links.py (copied from the
  # library). Scans docs/ + README.md + CLAUDE.md.
  - project: eric/weisssrv-lib
    ref: v0.1.0
    file: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      changes:
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - "scripts/check-doc-links.py"

  # -- secret-detection: GitLab Secret Detection (gitleaks) ------------------
  # Defaults reproduce this template's previous job: the modern-CPU node
  # selector the shared runner allowlists, and allow_failure: true (findings
  # WARN). Tuned by .gitleaks.toml via .gitlab/secret-detection-ruleset.toml.
  # To make a secret finding HARD-BLOCK the pipeline, add
  # `inputs: { allow_failure: false }`.
  - project: eric/weisssrv-lib
    ref: v0.1.0
    file: /ci/security/secret-detection.yml

  # ==========================================================================
  # OPTIONAL — build THIS service's container image (the common single-image
  # case). Uncomment to enable. This is the ONLY job that needs a PRIVILEGED
  # runner: the shared tag-less tenant runner is non-privileged and CANNOT run
  # Docker-in-Docker. `tags: ["infrastructure"]` targets weisssrv's privileged
  # runner — retag to your OWN privileged runner if you registered one (the
  # shared `infrastructure` runner is reserved for the platform repo). Builds
  # the repo-root Dockerfile and pushes $CI_REGISTRY_IMAGE:<short-sha>
  # (+ :latest on main); point deployment.yaml's `image:` at that tag. Delete
  # the Dockerfile (`weisssrv-new-project prune image-build`) for an
  # upstream-image app. See docs/CONSUMING.md ("Building the service image").
  # --------------------------------------------------------------------------
  # - project: eric/weisssrv-lib
  #   ref: v0.1.0
  #   file: /ci/build/docker-build.yml
  #   inputs:
  #     tags: ["infrastructure"]     # a PRIVILEGED runner (retag to yours)
  #     dockerfile: "Dockerfile"
  #     # image_name: ""             # default: push to the $CI_REGISTRY_IMAGE base
  #     # context: "."
  #     # publish_on_main: true      # push :latest on main (always pushes :<sha>)

  # ==========================================================================
  # OPTIONAL — terraform fmt + validate, if this repo grows a terraform/ dir.
  # Inert until terraform/ exists (the changes: rules never match otherwise).
  # Runs on the shared runner (no LAN), so `plan`/`apply` (not shipped here)
  # would need a remote/HTTP state backend and internet-reachable providers.
  # --------------------------------------------------------------------------
  # - project: eric/weisssrv-lib
  #   ref: v0.1.0
  #   file: /ci/validate/terraform.yml
  #   inputs:
  #     tags: []
  #     changes: ["terraform/**/*"]

# ============================================================================
# AI REVIEW — optional, never blocks. BYO-keys: runs only when BOTH masked
# CI/CD variables AI_REVIEW_OPENAI_KEY and GITLAB_REVIEW_TOKEN are set on the
# project (Settings -> CI/CD -> Variables); absent them (e.g. fork MRs) the job
# simply isn't created. There is no in-job 1Password path: the shared runner is
# non-root and can't install the op CLI at job time, so 1Password users source
# those two values from their vault WHEN THEY SET the CI variables (e.g.
# `op read "op://Homelab/OpenAI API Key/api-key"`), not at runtime. This is the
# ONE generic job the library does not ship (it carries no pr-agent template),
# so it stays defined here — see docs/CONSUMING.md ("Bring your own keys").
# ============================================================================
pr-agent-review:
  stage: ai-review
  # Digest-pinned: this job exports a GitLab PAT and an OpenAI key into the
  # container, so the image must not move under a mutable tag (supply-chain).
  image: codiumai/pr-agent:0.34@sha256:1c1743e93bf6627cd14528cd4defe82465f17860e8f20e6c0ac6558971f61c61
  needs:
    - job: yaml-lint
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
      optional: true
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
  before_script:
    - export OPENAI__KEY="$AI_REVIEW_OPENAI_KEY"
    - export GITLAB__PERSONAL_ACCESS_TOKEN="$GITLAB_REVIEW_TOKEN"
  script:
    - |
      python -m pr_agent.cli \
        --pr_url="${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AI_REVIEW_OPENAI_KEY && $GITLAB_REVIEW_TOKEN'
  allow_failure: true
  timeout: 30m

# ============================================================================
# OPTIONAL manual reconcile poke. Flux owns deploys: on merge to main it pulls
# this repo and reconciles automatically (see the operator-side GitRepository).
# This job only fast-forwards that by POSTing to a Flux webhook receiver, and
# only if you set FLUX_WEBHOOK_URL (the receiver must be PUBLICLY reachable —
# the shared runner has no LAN access). Default off.
# ----------------------------------------------------------------------------
# trigger-reconcile:
#   stage: ai-review
#   image: curlimages/curl:8.11.1
#   needs: []
#   script:
#     - curl -fsS -X POST "$FLUX_WEBHOOK_URL"
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "main" && $FLUX_WEBHOOK_URL'
#       when: manual
#       allow_failure: true
