---
# CI for the template itself. The generic jobs come from the shared library, so
# the template is linted by the same tooling it hands to a generated repo.
#
# Every job is TAG-LESS and non-root safe (pip --user, workspace-local tool
# downloads), so they land on the shared runner.
#
# `release` is LAST on purpose: the semantic-release job sets no `needs:`, so
# stage ordering is what gates a tag on every job above it — including
# `render-validate`. A template tag is what a generated repo's `copier update`
# resolves to, so it must never be cut from a tree that does not render.
stages:
  - lint
  - test
  - security
  - ai-review
  - release

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "web"'

variables:
  LIB_PROJECT: "eric/weisssrv-lib"
  # Single source for the library pin. `include:` CANNOT read this — it is
  # resolved before job variables exist — so each entry below repeats the tag as
  # a literal and scripts/check-lib-pins.py (vendored from the library) fails
  # the pipeline if they drift from it or pin a branch. Bump here, then
  # `scripts/check-lib-pins.py --fix`.
  WEISSSRV_LIB_REF: "v0.13.0"
  COPIER_VERSION: "9.17.0"
  PYYAML_VERSION: "6.0.2"
  YAMLLINT_VERSION: "1.38.0"
  RUFF_VERSION: "0.16.0"
  KUBECONFORM_VERSION: "0.6.7"
  KUBECONFORM_SHA256: "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73"
  KUSTOMIZE_VERSION: "5.4.3"
  KUSTOMIZE_SHA256: "3669470b454d865c8184d6bce78df05e977c9aea31c30df3c669317d43bcc7a7"

include:
  # Only genuine YAML: files under template/ that carry the .jinja suffix are
  # Jinja sources, not documents, and the conditional paths are not valid names
  # until they are rendered. render-validate yamllints the rendered tree, which
  # is where template/ actually gets covered.
  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/lint/yaml-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      config: "-c .yamllint"
      targets: "copier.yml tests/ .gitlab-ci.yml .yamllint scripts/vendored-manifest.yml"
      changes:
        - "copier.yml"
        - "tests/**/*"
        - ".yamllint"
        - ".gitlab-ci.yml"
        - "scripts/vendored-manifest.yml"

  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/lint/python-lint.yml
    inputs:
      tags: []
      image: python:3.13-slim
      # `scripts` is this repository's OWN vendored tooling. `template/scripts`
      # is on the target list, but ruff's walk only classifies
      # check-doc-links.py there: the other two carry a conditional Jinja path
      # as their filename, so they do not end in `.py`. They are byte-identical
      # vendored copies, linted in the library and again in every render, so
      # the coverage is real — it just does not come from this job.
      targets: "scripts tests template/scripts"
      changes:
        - "scripts/**/*.py"
        - "tests/**/*.py"
        - "template/**/*.py"
        - "ruff.toml"
        - ".gitlab-ci.yml"

  # copier.yml schema checks + the render invariants. Everything in the
  # repository feeds a render, hence the catch-all `changes`.
  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/test/python-tests.yml
    inputs:
      tags: []
      image: python:3.13
      apt_packages: ""
      test_dir: "tests"
      pip_packages: "copier==9.17.0 jinja2"
      changes:
        - "**/*"

  # Self-application: the template ships this checker into every generated repo,
  # and its own docs carry the same relative cross-links. The checker scans every
  # TRACKED *.md, so `template/**/*.md` is listed too — the forge templates there
  # are tracked Markdown, and an edit to one must not skip the gate.
  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/lint/docs-link-check.yml
    inputs:
      tags: []
      changes:
        - "docs/**/*"
        - "README.md"
        - "CLAUDE.md"
        - "AGENTS.md"
        - "template/**/*.md"
        - "scripts/check-doc-links.py"

  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/security/secret-detection.yml
    inputs:
      tags: []

  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/review/pr-agent.yml
    inputs:
      tags: []
      gitlab_url: "https://git.ericsweiss.com"
      # Do NOT override openai_key/gitlab_token: the library already defaults
      # them to $OPENAI__KEY / $GITLAB__PERSONAL_ACCESS_TOKEN, and a renamed
      # variable means the job is never created and the pipeline goes green with
      # no review.
      gate: "$OPENAI__KEY && $GITLAB__PERSONAL_ACCESS_TOKEN"
      needs:
        - job: yaml-lint
          optional: true
        - job: python-tests
          optional: true
        - job: render-validate
          optional: true

  # Cuts THIS template's tag from the conventional commits merged to main — the
  # tag a generated repo's `copier update` resolves to and records as `_commit`
  # in .copier-answers.yml. Untagged, copier falls back to HEAD, so every update
  # pulls unreleased work; see docs/VERSIONING.md.
  - project: eric/weisssrv-lib
    ref: v0.13.0
    file: /ci/release/semantic-release.yml
    inputs:
      tags: []

# The library-pin gate, kept as a job of its own so it runs whatever happens to
# tests/. It reads variables.WEISSSRV_LIB_REF and requires every include above
# to pin exactly it, as a release tag.
lib-pin-check:
  stage: lint
  image: python:3.13-slim
  tags: []
  needs: []
  script:
    - pip install --quiet --no-cache-dir "pyyaml==$PYYAML_VERSION"
    - python3 scripts/check-lib-pins.py --project "$LIB_PROJECT"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ".gitlab-ci.yml"
        - "scripts/check-lib-pins.py"
    - if: '$CI_COMMIT_BRANCH == "main"'

render-validate:
  stage: test
  image: python:3.13
  tags: []
  needs: []
  # This job requests the largest limits in the pipeline, so on the quota-capped
  # shared runner it is the first to be refused at POD-CREATION time when several
  # pipelines overlap. That arrives as a system failure rather than a test
  # failure, which the retry turns into throttling instead of a red pipeline that
  # says nothing about the render.
  retry:
    max: 2
    when:
      - runner_system_failure
      - scheduler_failure
  variables:
    LIB_CHECKOUT: "$CI_PROJECT_DIR/.tmp/lib"
  before_script:
    - export PATH="$CI_PROJECT_DIR/.bin:$(python -m site --user-base)/bin:$PATH"
    - mkdir -p "$CI_PROJECT_DIR/.bin"
    - |
      pip install --user --quiet \
        "copier==${COPIER_VERSION}" \
        "pyyaml==${PYYAML_VERSION}" \
        "yamllint==${YAMLLINT_VERSION}" \
        "ruff==${RUFF_VERSION}"
    - |
      set -eo pipefail
      # Non-root tool install: stdlib download, sha256 verify, extract into a
      # workspace bin that before_script already put on PATH.
      fetch_verified() {  # <file> <url> <sha256>
        python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$2" "/tmp/$1"
        echo "$3  /tmp/$1" | sha256sum -c -
      }
      fetch_verified kubeconform.tar.gz \
        "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
        "$KUBECONFORM_SHA256"
      tar xzf /tmp/kubeconform.tar.gz -C "$CI_PROJECT_DIR/.bin" kubeconform
      fetch_verified kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        "$KUSTOMIZE_SHA256"
      tar xzf /tmp/kustomize.tar.gz -C "$CI_PROJECT_DIR/.bin" kustomize
      kubeconform -v && kustomize version
    - |
      set -eo pipefail
      # The ref under test is copier.yml's lib_ref default — the single source
      # the fixtures inherit — so the vendored-copy gate, the render and the
      # generated pipeline can never disagree about which library is exercised.
      LIB_REF=$(python -c "import yaml; print(yaml.safe_load(open('copier.yml'))['lib_ref']['default'])")
      git clone --depth 1 --branch "$LIB_REF" \
        "${CI_SERVER_PROTOCOL}://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}:${CI_SERVER_PORT}/${LIB_PROJECT}.git" \
        "$LIB_CHECKOUT"
  script:
    # ONE render per invocation, so every branch that changes the file SET needs
    # a line of its own. pytest's own toolchain gates skip in this image, so
    # without these lines those trees are linted nowhere.
    #
    # Reference-shaped fixture. --lib-path adds the two gates that read the
    # library rather than the render: the vendored-copy registry, and the
    # include contract (every passed input exists, every job's stage is
    # declared).
    - python3 tests/validate_render.py --lib-path "$LIB_CHECKOUT"
    # Contrast fixture: different in every field, every optional component off,
    # a different CI shape. A value hardcoded from the reference cluster renders
    # identically to a correct substitution under the shaped fixture, and fails
    # here.
    - python3 tests/validate_render.py --answers tests/answers-unlike.yml
    # The pipeline-less shape: the Taskfile's flux-lint branch and the absence
    # of the release script from the ruff surface exist in no other render.
    - python3 tests/validate_render.py --data ci_shape=none
    # No secret surface at all. The pull credential is overridden with it
    # because it is an ExternalSecret too, and copier takes a skipped question's
    # value from the data file rather than from its default.
    #
    # --lib-path again: this render keeps the GitLab shape, and the rule is that
    # every invocation rendering a pipeline gets the include-contract gate — the
    # two that do not (the contrast fixture and ci_shape=none) ship no pipeline
    # for it to read.
    - >-
      python3 tests/validate_render.py --lib-path "$LIB_CHECKOUT"
      --data secrets_backend=none --data enable_registry_pull_secret=false
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "**/*"
    - if: '$CI_COMMIT_BRANCH == "main"'
      changes:
        - "**/*"
    - if: '$CI_PIPELINE_SOURCE == "web"'
