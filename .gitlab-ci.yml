---
# CI for a weisssrv cluster tenant repo.
#
# Runner: this pipeline is deliberately TAG-LESS so it lands on the shared,
# non-privileged `k8s-deploy` runner (weisssrv's `infrastructure` runner is
# reserved for the platform repo). That runner's egress is firewalled to the
# internet only — build, lint, kubeconform and the container registry all work;
# there is NO LAN/tailnet access and NO SSH. Deploys happen through Flux (git
# is the source of truth), never a CI `kubectl apply`.
#
# Keep this file small: add jobs your app actually needs, delete what it does not.
stages:
  - build
  - lint
  - validate
  - security
  - ai-review

variables:
  # Pinned lint tooling (verified by sha256 before use). Bump deliberately.
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUSTOMIZE_VERSION: "5.8.1"
  KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
  # kubeconform validates against this Kubernetes minor's API schemas — keep it
  # on the cluster's k8s version (k3s v1.36.x today).
  K8S_VERSION: "1.36.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ============================================================================
# BUILD — container image (only runs if the repo has a Dockerfile)
# ============================================================================
# Daemonless build+push with kaniko. This pipeline is tag-less, so it lands on
# the shared, non-privileged `k8s-deploy` runner — which CANNOT run
# Docker-in-Docker (DinD needs a privileged runner, and weisssrv reserves its
# only privileged runner, tags: [infrastructure], for the platform repo). kaniko
# builds in userspace with no daemon and no privileged mode, using GitLab's
# predefined CI_REGISTRY_* credentials against registry.git.ericsweiss.com. MR
# pipelines tag by commit SHA; main also tags :latest; git tags add :<tag> +
# :latest. A registry-backed layer cache speeds rebuilds.
#
# The shared runner also runs job pods as a non-root UID, so registry auth is
# written to a workspace-local DOCKER_CONFIG (the image's /kaniko dir is
# root-owned and not writable here). This suits Dockerfiles that don't need to
# modify root-owned base-image files; for anything heavier, build/push the image
# from a privileged environment and just point deployment.yaml's `image:` at it
# — no CI build required.
build-image:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:v1.24.0-debug
    entrypoint: [""]
  variables:
    # Writable docker-config path (job runs non-root; /kaniko/.docker is not).
    DOCKER_CONFIG: "$CI_PROJECT_DIR/.docker"
  before_script:
    # Registry auth for kaniko. CI_REGISTRY_PASSWORD is masked in job logs and
    # the base64 is computed at runtime (written to a file, never echoed), so no
    # credential leaks to the log.
    - mkdir -p "$DOCKER_CONFIG"
    - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > "$DOCKER_CONFIG/config.json"
  script:
    - |
      set -e
      REF="$CI_REGISTRY_IMAGE"
      DESTS="--destination ${REF}:${CI_COMMIT_SHORT_SHA}"
      # :<tag> destination on git tags; :latest on main and on tags.
      if [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination ${REF}:${CI_COMMIT_TAG}"
      fi
      if [ "$CI_COMMIT_BRANCH" = "main" ] || [ -n "$CI_COMMIT_TAG" ]; then
        DESTS="$DESTS --destination ${REF}:latest"
      fi
      # Word-splitting $DESTS is intentional (one arg per --destination token).
      /kaniko/executor \
        --context "$CI_PROJECT_DIR" \
        --dockerfile "$CI_PROJECT_DIR/Dockerfile" \
        --cache=true \
        --cache-repo "${REF}/cache" \
        $DESTS
  rules:
    # Auto-activates the moment you add a Dockerfile; inert until then.
    - exists:
        - Dockerfile

# ============================================================================
# LINT
# ============================================================================
yaml-lint:
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    - pip install --quiet "yamllint==1.38.0"
  script:
    - yamllint -c .yamllint .

# Render kubernetes/flux and schema-validate it with kubeconform. No Flux
# postBuild `${var}` substitution here — tenants pin literal image tags
# (Renovate bumps them), so unlike the weisssrv pipeline there is nothing to
# envsubst. Tools are pinned and sha256-verified before use.
flux-lint:
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl
    - |
      set -e
      fetch_verified() {  # <file> <url> <sha256>
        curl -fsSL -o "/tmp/$1" "$2"
        echo "$3  /tmp/$1" | sha256sum -c -
      }
      fetch_verified kubeconform.tar.gz \
        "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
        "$KUBECONFORM_SHA256"
      tar xzf /tmp/kubeconform.tar.gz -C /usr/local/bin kubeconform
      fetch_verified kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        "$KUSTOMIZE_SHA256"
      tar xzf /tmp/kustomize.tar.gz -C /usr/local/bin kustomize
      kubeconform -v && kustomize version
  script:
    - |
      set -eo pipefail
      echo "=== kustomize build kubernetes/flux ==="
      kustomize build kubernetes/flux > /tmp/rendered.yaml
      echo "=== kubeconform (k8s ${K8S_VERSION}) ==="
      # -ignore-missing-schemas lets platform CRDs (IngressRoute, Certificate,
      # ExternalSecret, ServiceMonitor, PrometheusRule, VPA) validate against the
      # datreeio CRD catalog; core kinds validate against the bundled schemas.
      kubeconform -strict -ignore-missing-schemas \
        -kubernetes-version "$K8S_VERSION" \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        -summary /tmp/rendered.yaml

# ============================================================================
# SECURITY — GitLab Secret Detection (gitleaks), tuned by .gitleaks.toml via
# the passthrough in .gitlab/secret-detection-ruleset.toml.
# ============================================================================
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  needs: []
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    # gitleaks' binary needs POPCNT/SSE4.2; pin scans to modern-CPU nodes so it
    # doesn't SIGILL on the cluster's older agents. (This selector override is
    # allowlisted on the shared runner.)
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"

# ============================================================================
# AI REVIEW — optional, never blocks. Runs when EITHER credential path exists:
#   * OP_SERVICE_ACCOUNT_TOKEN  → reads the OpenAI key + GitLab token from
#     1Password (paths overridable via AI_REVIEW_OP_* CI variables), or
#   * AI_REVIEW_OPENAI_KEY + GITLAB_REVIEW_TOKEN → plain masked CI variables.
# Fork MRs (no credentials) simply don't create this job — that's expected.
# ============================================================================
pr-agent-review:
  stage: ai-review
  image: codiumai/pr-agent:0.34
  needs:
    - job: yaml-lint
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
      optional: true
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
    # Override AI_REVIEW_* CI variables to change model / 1Password item paths.
    AI_REVIEW_OP_OPENAI_PATH: "op://Homelab/OpenAI API Key/api-key"
    AI_REVIEW_OP_GITLAB_PATH: "op://Homelab/GitLab API Token/credential"
  before_script:
    - |
      set -e
      if [ -n "$OP_SERVICE_ACCOUNT_TOKEN" ]; then
        apt-get update -qq && apt-get install -y -qq curl gnupg
        curl -sS https://downloads.1password.com/linux/keys/1password.asc \
          | gpg --dearmor --output /usr/share/keyrings/1password-archive-keyring.gpg
        echo "deb [arch=amd64 signed-by=/usr/share/keyrings/1password-archive-keyring.gpg] https://downloads.1password.com/linux/debian/amd64 stable main" \
          > /etc/apt/sources.list.d/1password.list
        apt-get update -qq && apt-get install -y -qq 1password-cli
        export OPENAI__KEY=$(op read "$AI_REVIEW_OP_OPENAI_PATH")
        export GITLAB__PERSONAL_ACCESS_TOKEN=$(op read "$AI_REVIEW_OP_GITLAB_PATH")
      else
        export OPENAI__KEY="$AI_REVIEW_OPENAI_KEY"
        export GITLAB__PERSONAL_ACCESS_TOKEN="$GITLAB_REVIEW_TOKEN"
      fi
  script:
    - |
      python -m pr_agent.cli \
        --pr_url="${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $OP_SERVICE_ACCOUNT_TOKEN'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AI_REVIEW_OPENAI_KEY && $GITLAB_REVIEW_TOKEN'
  allow_failure: true
  timeout: 30m

# ============================================================================
# OPTIONAL manual reconcile poke. Flux owns deploys: on merge to main it pulls
# this repo and reconciles automatically (see the operator-side GitRepository).
# This job only fast-forwards that by POSTing to a Flux webhook receiver, and
# only if you set FLUX_WEBHOOK_URL (the receiver must be PUBLICLY reachable —
# the shared runner has no LAN access). Default off.
