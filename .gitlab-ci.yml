---
# CI for a weisssrv cluster tenant repo.
#
# Runner: this pipeline is deliberately TAG-LESS so it lands on the shared,
# non-privileged `k8s-deploy` runner (weisssrv's `infrastructure` runner is
# reserved for the platform repo). That runner's egress is firewalled to the
# internet only — build, lint, kubeconform and the container registry all work;
# there is NO LAN/tailnet access and NO SSH. Deploys happen through Flux (git
# is the source of truth), never a CI `kubectl apply`.
#
# Keep this file small: add jobs your app actually needs, delete what it does not.
stages:
  - build
  - lint
  - validate
  - security
  - ai-review

variables:
  # Pinned lint tooling (verified by sha256 before use). Bump deliberately.
  KUBECONFORM_VERSION: "0.8.0"
  KUBECONFORM_SHA256: "9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883"
  KUSTOMIZE_VERSION: "5.8.1"
  KUSTOMIZE_SHA256: "029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d"
  # kubeconform validates against this Kubernetes minor's API schemas — keep it
  # on the cluster's k8s version (k3s v1.36.x today).
  K8S_VERSION: "1.36.0"

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_TAG'

# ============================================================================
# BUILD — container image (built OUTSIDE this pipeline; see below)
# ============================================================================
# There is deliberately NO in-CI image build. This pipeline is tag-less, so it
# lands on weisssrv's shared `k8s-deploy` runner, which is BOTH non-privileged
# (no Docker-in-Docker) AND runs every job pod as a fixed non-root UID
# (run_as_user=1000, enforced cluster-side with no per-job override). No image
# builder works under that combination: docker/DinD needs privilege, and
# kaniko/buildah/buildkit all have to unpack the base image's root-owned
# filesystem into the container — which UID 1000 cannot write. A build job here
# would fail the moment you added a Dockerfile, breaking the green pipeline.
#
# So build the image ELSEWHERE and point deployment.yaml's `image:` at it:
#   * locally with `task build` (your workstation's Docker daemon), then
#     `docker push registry.git.ericsweiss.com/<group>/<slug>:<tag>`
#     (log in with a project deploy token or a personal access token), or
#   * an external CI that has a privileged/root builder (e.g. GitHub Actions), or
#   * any upstream image you already have — no build needed at all.
# Image tags are literal pins in deployment.yaml. renovate.json is provided, but
# NO Renovate bot runs against this self-hosted GitLab by default — bump tags
# yourself or enable the opt-in renovate job below (see README).
#
# If you register your OWN privileged runner for this project, you can add a
# kaniko/docker build job here and tag it for that runner. The shared runner
# cannot run it, so it stays out of the template. Example (uncomment + retag):
#
# build-image:
#   stage: build
#   tags: [your-privileged-runner]
#   image:
#     name: gcr.io/kaniko-project/executor:v1.24.0-debug
#     entrypoint: [""]
#   before_script:
#     - mkdir -p /kaniko/.docker
#     - echo "{\"auths\":{\"${CI_REGISTRY}\":{\"auth\":\"$(printf '%s:%s' "${CI_REGISTRY_USER}" "${CI_REGISTRY_PASSWORD}" | base64 | tr -d '\n')\"}}}" > /kaniko/.docker/config.json
#   script:
#     - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile"
#         --destination "${CI_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
#   rules:
#     - exists:
#         - Dockerfile

# ============================================================================
# LINT
# ============================================================================
yaml-lint:
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    # Jobs run as a non-root UID on the shared runner, so system site-packages
    # is not writable. Install into the user site (HOME is a writable emptyDir)
    # and invoke via `python -m` so no PATH surgery is needed.
    - pip install --user --quiet "yamllint==1.38.0"
  script:
    - python -m yamllint -c .yamllint .

# Render kubernetes/flux and schema-validate it with kubeconform. No Flux
# postBuild `${var}` substitution here — tenants pin literal image tags (bumped
# manually or by an opt-in Renovate job), so unlike the weisssrv pipeline there
# is nothing to envsubst. Tools are pinned and sha256-verified before use.
flux-lint:
  stage: lint
  image: python:3.13-slim
  needs: []
  before_script:
    # Non-root job: no apt-get (dpkg lock is root-only) and /usr/local/bin is
    # not writable. Download the pinned tools with Python's stdlib (no curl/apt),
    # verify each tarball's sha256, and extract into a workspace-local bin dir
    # on PATH. before_script + script share one shell, so the PATH export
    # carries into script.
    - |
      set -e
      export TOOLS_BIN="$CI_PROJECT_DIR/.bin"
      mkdir -p "$TOOLS_BIN"
      fetch_verified() {  # <file> <url> <sha256>
        python -c "import urllib.request,sys; urllib.request.urlretrieve(sys.argv[1], sys.argv[2])" "$2" "/tmp/$1"
        echo "$3  /tmp/$1" | sha256sum -c -
      }
      fetch_verified kubeconform.tar.gz \
        "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
        "$KUBECONFORM_SHA256"
      tar xzf /tmp/kubeconform.tar.gz -C "$TOOLS_BIN" kubeconform
      fetch_verified kustomize.tar.gz \
        "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" \
        "$KUSTOMIZE_SHA256"
      tar xzf /tmp/kustomize.tar.gz -C "$TOOLS_BIN" kustomize
      export PATH="$TOOLS_BIN:$PATH"
      kubeconform -v && kustomize version
  script:
    - |
      set -eo pipefail
      export PATH="$CI_PROJECT_DIR/.bin:$PATH"
      echo "=== kustomize build kubernetes/flux ==="
      kustomize build kubernetes/flux > /tmp/rendered.yaml
      echo "=== kubeconform (k8s ${K8S_VERSION}) ==="
      # -ignore-missing-schemas lets platform CRDs (IngressRoute, Certificate,
      # ExternalSecret, ServiceMonitor, PrometheusRule, VPA) validate against the
      # datreeio CRD catalog; core kinds validate against the bundled schemas.
      kubeconform -strict -ignore-missing-schemas \
        -kubernetes-version "$K8S_VERSION" \
        -schema-location default \
        -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
        -summary /tmp/rendered.yaml

# ============================================================================
# SECURITY — GitLab Secret Detection (gitleaks), tuned by .gitleaks.toml via
# the passthrough in .gitlab/secret-detection-ruleset.toml.
# ============================================================================
include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  needs: []
  variables:
    SECRET_DETECTION_HISTORIC_SCAN: "false"
    # gitleaks' binary needs POPCNT/SSE4.2; pin scans to modern-CPU nodes so it
    # doesn't SIGILL on the cluster's older agents. The shared k8s-deploy runner
    # allowlists exactly this override — its config sets
    # node_selector_overwrite_allowed = ^esweiss\.com/cpu=(modern|legacy)$ — so
    # the selector is honored, not rejected.
    KUBERNETES_NODE_SELECTOR_CPU: "esweiss.com/cpu=modern"
  # The bundled GitLab Secret-Detection template gates its job on
  # $CI_COMMIT_BRANCH, which is UNSET in merge_request_event pipelines. Without
  # this override the scan would run ONLY post-merge on main (and never on tags,
  # where $CI_COMMIT_BRANCH is also empty) — too late to block a leak. Override
  # the rules so it is a real pre-merge gate: MRs, main, and scheduled scans.
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "schedule"'

# ============================================================================
# AI REVIEW — optional, never blocks. Runs only when BOTH masked CI/CD
# variables AI_REVIEW_OPENAI_KEY and GITLAB_REVIEW_TOKEN are set on the project
# (Settings -> CI/CD -> Variables); absent them (e.g. fork MRs) the job simply
# isn't created. There is no in-job 1Password path: the shared runner is
# non-root and can't install the op CLI at job time, so 1Password users source
# those two values from their vault WHEN THEY SET the CI variables (e.g.
# `op read "op://Homelab/OpenAI API Key/api-key"`), not at runtime.
# ============================================================================
pr-agent-review:
  stage: ai-review
  # Digest-pinned: this job exports a GitLab PAT and an OpenAI key into the
  # container, so the image must not move under a mutable tag (supply-chain).
  image: codiumai/pr-agent:0.34@sha256:1c1743e93bf6627cd14528cd4defe82465f17860e8f20e6c0ac6558971f61c61
  needs:
    - job: yaml-lint
      optional: true
    - job: flux-lint
      optional: true
    - job: secret_detection
      optional: true
  variables:
    CONFIG__GIT_PROVIDER: "gitlab"
    GITLAB__URL: "https://git.ericsweiss.com"
  before_script:
    - export OPENAI__KEY="$AI_REVIEW_OPENAI_KEY"
    - export GITLAB__PERSONAL_ACCESS_TOKEN="$GITLAB_REVIEW_TOKEN"
  script:
    - |
      python -m pr_agent.cli \
        --pr_url="${CI_MERGE_REQUEST_PROJECT_URL}/-/merge_requests/${CI_MERGE_REQUEST_IID}" \
        review
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $AI_REVIEW_OPENAI_KEY && $GITLAB_REVIEW_TOKEN'
  allow_failure: true
  timeout: 30m

# ============================================================================
# OPTIONAL manual reconcile poke. Flux owns deploys: on merge to main it pulls
# this repo and reconciles automatically (see the operator-side GitRepository).
# This job only fast-forwards that by POSTing to a Flux webhook receiver, and
# only if you set FLUX_WEBHOOK_URL (the receiver must be PUBLICLY reachable —
# the shared runner has no LAN access). Default off.
# ----------------------------------------------------------------------------
# trigger-reconcile:
#   stage: ai-review
#   image: curlimages/curl:8.11.1
#   needs: []
#   script:
#     - curl -fsS -X POST "$FLUX_WEBHOOK_URL"
#   rules:
#     - if: '$CI_COMMIT_BRANCH == "main" && $FLUX_WEBHOOK_URL'
#       when: manual
#       allow_failure: true

# ============================================================================
# RENOVATE (optional) — keep the literal image pins current. There is NO hosted
# Renovate on git.ericsweiss.com, so renovate.json is inert until something runs
# it. This job runs self-hosted Renovate against THIS project on a schedule.
# To enable: uncomment, create a pipeline SCHEDULE (CI/CD -> Schedules, e.g.
# weekly) so `$CI_PIPELINE_SOURCE == "schedule"`, and set a masked RENOVATE_TOKEN
# CI/CD variable (a GitLab PAT with api scope for this project). Add
# hostRules/registry credentials in renovate.json's env if you need Renovate to
# read the PRIVATE registry tag list. Alternative: skip this and bump tags by
# hand, mirroring weisssrv's `task maintenance:check-versions` flow.
# ----------------------------------------------------------------------------
# renovate:
#   stage: validate
#   image: renovate/renovate:41
#   needs: []
#   variables:
#     RENOVATE_PLATFORM: gitlab
#     RENOVATE_ENDPOINT: "https://git.ericsweiss.com/api/v4"
#     RENOVATE_TOKEN: "$RENOVATE_TOKEN"
#     RENOVATE_REPOSITORIES: "$CI_PROJECT_PATH"
#   script:
#     - renovate
#   rules:
#     - if: '$CI_PIPELINE_SOURCE == "schedule" && $RENOVATE_TOKEN'

