# Forked from weisssrv-lib lint/ruff.toml: header comments only, the rule
# selection is the library's. Dropped at the repo root so local ruff and the
# python-lint CI job resolve one profile by discovery.
target-version = "py39"

[lint]
# Correctness rules only: pyflakes, the error-level pycodestyle subsets, W and
# bugbear. Formatting-only rules stay out; the family has no formatter.
select = ["E4", "E7", "E9", "F", "W", "B"]
