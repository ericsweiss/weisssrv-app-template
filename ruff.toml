# Forked from weisssrv-lib `lint/ruff.toml`: the same rule selection under a
# header written for this repository. What THIS file lints is the template
# itself — `scripts/`, `tests/` and `template/scripts/`. The `python-lint` job
# in .gitlab-ci.yml passes no `config:` input and a local `ruff check` passes no
# `--config`, so both resolve it by discovery from the repo root and cannot
# disagree; without it ruff's built-in defaults would flag style rules the
# vendored library scripts deliberately do not follow. Copy the `[lint]` block
# and `target-version` on a library bump; this header is local. The tenant's
# own copy is template/ruff.toml.
#
# `target-version` must not exceed the lowest Python this repo's scripts support
# (the vendored helpers are stdlib-only and 3.9-compatible).
target-version = "py39"

[lint]
# Correctness-first selection: pyflakes (F), the pycodestyle subsets that flag
# real errors rather than layout (E4 imports, E7 statements, E9 syntax/IO), W
# (invalid escapes, trailing whitespace), and bugbear (B). Formatting-only rules
# (line length, quote style, import order) are deliberately OUT — the family has
# no formatter and churning them would bury the findings that matter.
select = ["E4", "E7", "E9", "F", "W", "B"]
