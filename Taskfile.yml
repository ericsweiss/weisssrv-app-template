---
version: "3"

# Small task runner for local development against the weisssrv cluster.
# `task --list` shows everything. Cluster-touching tasks need a kubeconfig on
# KUBECONFIG (the operator provides one); they are read-only except
# `flux:reconcile`, which only pokes the reconciler.

vars:
  # Your app slug. After running scripts/rename.sh these become your real name;
  # override per-invocation with e.g. `task flux:status APP=myapp`.
  APP: changeme-app
  # The tenant namespace and the cluster-side Flux Kustomization are both named
  # after the slug (see docs/ONBOARDING.md).
  NAMESPACE: "{{.APP}}"
  KUSTOMIZATION: "{{.APP}}"
  # The cluster's Kubernetes minor. Pinned identically in .gitlab-ci.yml
  # (flux-lint `k8s_version`) and .github/workflows/ci.yml (K8S_VERSION);
  # tests/test_ci_shapes.py asserts the three agree.
  K8S_VERSION: "1.36.0"
  CRD_CATALOG: 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{`{{.Group}}`}}/{{`{{.ResourceKind}}`}}_{{`{{.ResourceAPIVersion}}`}}.json'

tasks:
  default:
    cmds:
      - task --list
    silent: true

  lint:
    desc: Run every local check — the same five gates the CI lint stage runs.
    cmds:
      - task: yaml-lint
      - task: flux-lint
      - task: shellcheck
      - task: python-lint
      - task: doc-links

  yaml-lint:
    desc: Lint YAML with the shared .yamllint config.
    cmds:
      - yamllint -c .yamllint .

  flux-lint:
    desc: kustomize build + kubeconform, for the live tree and the opt-in add-ons.
    # pipefail: without it only kubeconform's status counts, and a FAILED
    # `kustomize build` hands it empty stdin — which it accepts, exiting 0. This
    # task is the whole lint gate in CI shape `none`, so a broken kustomization
    # would go green. (CI's own runs are already `set -eo pipefail`.)
    set: [pipefail]
    cmds:
      - for: ["kubernetes/flux", "kubernetes/flux/optional"]
        cmd: >-
          kustomize build {{.ITEM}} |
          kubeconform -strict -ignore-missing-schemas
          -kubernetes-version {{.K8S_VERSION}}
          -schema-location default
          -schema-location '{{.CRD_CATALOG}}'
          -summary

  shellcheck:
    desc: Lint scripts/*.sh with the same severity/exclusions as CI.
    cmds:
      - shellcheck --severity=warning --exclude=SC1091,SC2034 scripts/*.sh

  python-lint:
    desc: Lint the repo's Python with ruff, using the vendored ./ruff.toml.
    # Same targets as the CI job; drop `tests` here too if you delete the
    # template's gate. ruff resolves ./ruff.toml itself, so no --config.
    cmds:
      - ruff check --no-cache --output-format concise scripts tests

  doc-links:
    desc: Resolve every relative Markdown cross-link (vendored, stdlib-only).
    cmds:
      - python3 scripts/check-doc-links.py

  test:
    desc: >-
      Run the TEMPLATE's own gate (rename + CI-shape selection on a scratch
      copy). Needs pytest and the weisssrv-new-project CLI; skips itself once
      this project has been renamed.
    cmds:
      - python3 -m pytest tests

  render:
    desc: Print the rendered manifests kustomize will hand to Flux.
    cmds:
      - kustomize build kubernetes/flux

  build:
    desc: Build the container image locally (requires a Dockerfile).
    cmds:
      - test -f Dockerfile || (echo "no Dockerfile — add one to build an image"; exit 1)
      - docker build -t {{.APP}}:dev .

  flux:status:
    desc: Show the tenant Kustomization's reconcile state (read-only; needs KUBECONFIG).
    cmds:
      - flux get kustomization {{.KUSTOMIZATION}}

  flux:reconcile:
    desc: Force an immediate reconcile of the tenant Kustomization (needs KUBECONFIG).
    cmds:
      - flux reconcile kustomization {{.KUSTOMIZATION}} --with-source

  secrets:check:
    desc: Check ExternalSecret sync status in the tenant namespace (needs KUBECONFIG).
    cmds:
      - kubectl get externalsecret -n {{.NAMESPACE}}
