---
# The contrast fixture: every answer differs from answers-weisssrv-shaped.yml's
# except lib_ref, lib_project and the public route, and every other component is
# off. It answers every asked question, even one these answers make copier skip.
app_slug: tidepool
# Deliberately NOT equal to app_slug: every manifest names one or the other, and
# a fixture where they coincide cannot prove which one a given line used.
app_namespace: tidepool-svc
app_port: 9443
replica_count: 1
copyright_holder: Brinemoor Seaworks Cooperative

external_domain: brinemoor.test
internal_domain: internal.brinemoor.example
node_label_domain: internal.brinemoor.example
internal_vip: 10.77.4.8
registry_host: harbor.brinemoor.test
registry_pull_host: harbor.internal.brinemoor.example
runbook_url: https://forge.brinemoor.test/seaworks/tidepool/-/blob/main/RUNBOOK.md

# The GitHub shape, with no image build: the two conditional-path branches the
# shaped fixture never renders.
ci_shape: github
forge: github
change_request: pull request
enable_image_build: false
git_host: forge.brinemoor.test
git_namespace: seaworks
privileged_runner_tag: tidal-privileged
ci_cpu_selector: internal.brinemoor.example/cpu=modern
k8s_version: "1.33.0"

secrets_backend: gitlab
onepassword_vault: tidepool-svc
secret_item: Ledger Keys
# The GitLab instance holding the CI/CD variables. Answered UNLIKE git_host so
# the render proves the store's url comes from this answer, not from the forge.
gitlab_api_url: https://vault-forge.brinemoor.test

enable_servicemonitor: false
# The app's only route, since the internal one is off.
enable_public_ingress: true
enable_internal_ingress: false
enable_hpa: false
enable_vpa: false
enable_registry_pull_secret: false
enable_sso: false
# Not asked under the GitLab backend; the unlike-db render turns the database on
# and asks the db_* answers below, unlike fixture A's so the leak scan can tell.
database: none
db_name: tide_store
db_role_prefix: tide
db_storage_size: 7Gi
db_backup_bucket: tidepool-archive
db_backup_endpoint: https://objects.brinemoor.test
db_backup_item: Archive Key
db_roles_item: Role Passwords
db_apiserver_cidrs: 192.0.2.10/32
db_dump_timezone: Europe/Lisbon
db_runbook_url: https://forge.brinemoor.test/seaworks/tidepool/-/blob/main/DATABASE.md

# Never asked (the library is only included by the GitLab shape).
lib_ref: v0.23.0
lib_project: eric/weisssrv-lib
