---
# Answer fixture A: the same shape as the reference cluster, every optional
# component on. Every ASKED question in copier.yml needs an entry here; a
# computed one is left out, so the render proves the expression that makes it.
app_slug: recipe-box
app_namespace: recipe-box
app_port: 8080
replica_count: 2
copyright_holder: Eric S. Weiss

external_domain: ericsweiss.com
internal_domain: esweiss.com
node_label_domain: esweiss.com
internal_vip: 10.0.10.101
registry_host: registry.git.ericsweiss.com
registry_pull_host: registry.git.esweiss.com
runbook_url: https://git.ericsweiss.com/eric/weisssrv/-/blob/main/docs/29-flux-operations.md

ci_shape: gitlab_selfhosted
forge: gitlab
# Only `forge: other` is asked for this word; answered anyway so the fixture
# covers the whole question set, and equal to what the default computes.
change_request: merge request
enable_image_build: true
git_host: git.ericsweiss.com
git_namespace: eric
privileged_runner_tag: infrastructure
ci_cpu_selector: esweiss.com/cpu=modern
k8s_version: "1.36.0"

secrets_backend: onepassword
onepassword_vault: Homelab
secret_item: App Secrets
# Never asked (the GitLab backend is not selected); answered so the fixture
# covers the whole question set.
gitlab_api_url: https://git.ericsweiss.com

enable_servicemonitor: true
enable_internal_ingress: true
enable_hpa: true
enable_vpa: true
enable_registry_pull_secret: true
enable_sso: true

# copier.yml's lib_ref default, held there by test_copier_config.py.
lib_ref: v0.18.1
lib_project: eric/weisssrv-lib
