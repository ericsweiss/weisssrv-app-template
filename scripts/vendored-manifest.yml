---
# The consumer side of the vendored-copy contract: what this repo copies from
# weisssrv-lib, and where each copy lives. Entry forms, the `forked:` rules and
# the `template/` path prefix are in docs/VERSIONING.md, Vendored copies.

vendored:
  # The root copies are what this repo lints and, where it has the tree for
  # them, runs on ITSELF …
  - scripts/check-doc-links.py
  - scripts/check-lib-pins.py
  - scripts/semantic-release.py
  # … and the template/ copies are the same files rendered into a tenant.
  # Both are registered: a re-vendor that touched only the root pair would
  # otherwise ship a stale script to every repo generated afterwards.
  - lib: scripts/check-doc-links.py
    consumer: template/scripts/check-doc-links.py
  - lib: scripts/check-netpol-except-parity.py
    consumer: template/scripts/check-netpol-except-parity.py
  # check-lib-pins.py needs scripts/ci_yaml.py beside both of its copies from
  # library v0.18.0: docs/VERSIONING.md, Pending at the next library bump.
  - lib: scripts/check-lib-pins.py
    consumer: "template/scripts/{% if ci_shape == 'gitlab_selfhosted' %}check-lib-pins.py{% endif %}"
  - lib: scripts/semantic-release.py
    consumer: "template/scripts/{% if ci_shape != 'none' %}semantic-release.py{% endif %}"
  # The check-lib-pins suite is canonical in the library: a consumer that
  # vendors the script vendors its tests and adds only its own smoke test.
  - tests/test_check_lib_pins.py
  - lib: ci/release/github-release-workflow.example.yml
    consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/release.yml"
  - lib: ci/github/ci.example.yml
    consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/ci.yml"
  # Gated on `enable_image_build` as well as the shape, so both shapes agree
  # on what `enable_image_build: false` means.
  - lib: ci/github/build-image.example.yml
    consumer: "template/{% if ci_shape == 'github' %}.github{% endif %}/workflows/{% if enable_image_build %}build-image.yml{% endif %}"

forked:
  - lib: lint/ruff.toml
    consumer: ruff.toml
    reason: Header comments only; the rule selection is the library's.
    reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
  - lib: lint/gitleaks.toml
    consumer: .gitleaks.toml
    reason: Allowlist paths and fixture anchors are per-repo.
    reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
  # The root ruleset, the one this template's OWN pipeline loads. A separate
  # file from the tenant copy below and it drifts separately, so both are
  # registered — the same split the scripts and lint profiles get.
  - lib: lint/secret-detection-ruleset.toml
    consumer: .gitlab/secret-detection-ruleset.toml
    reason: >-
      Header comments and the ruleset description string; the passthrough is
      the library's.
    reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
  # One line, quoted, however long: a folded scalar reconstructs the literal
  # filename only if the wrap lands on a space, so re-wrapping it silently
  # produces a different path.
  - lib: lint/secret-detection-ruleset.toml
    consumer: "template/{% if forge == 'gitlab' %}.gitlab{% endif %}/{% if ci_shape == 'gitlab_selfhosted' %}secret-detection-ruleset.toml{% endif %}"
    reason: >-
      Header comments and the ruleset description string; the passthrough is
      the library's.
    reconciled_sha256: d6413e69a2d8a6f7d0c468d4370a406299894ad9e3fe274eb7f69eb30a7c936d
  # The family spells the profile at this path, not the root `.yamllint` that
  # ansible-lint discovers and lets override its own yaml rule. Callers pass `-c`.
  - lib: lint/yamllint-relaxed.yml
    consumer: lint/yamllint-relaxed.yml
    reason: Header comments only; the rules are the library's.
    reconciled_sha256: 7fcb8f02aadf68b97cd334a69a889c8cd87ac4796927c086bf77702a247ae2d5
  - lib: lint/editorconfig
    consumer: .editorconfig
    reason: Per-repo file-type sections on a shared base.
    reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
  - lib: lint/pre-commit-config.yaml
    consumer: .pre-commit-config.yaml
    reason: >-
      Template-repo hook set on a shared base: the template/ tree is excluded
      from the YAML hooks.
    reconciled_sha256: 39e7c3a5fbc7d2185ad73c436cbba736cae1e2b2b88f7f50387f041cbd87323c
  - lib: lint/pre-commit-config.yaml
    consumer: template/.pre-commit-config.yaml
    reason: >-
      The library's hook set plus four local hooks: the egress fence, the
      scrape-wiring check, the kustomization check and the doc-link check, so a
      tenant with no pipeline still runs them. The header also drops the
      library's copy instruction.
    reconciled_sha256: 39e7c3a5fbc7d2185ad73c436cbba736cae1e2b2b88f7f50387f041cbd87323c
  # Tenant-side lint profiles, the same split as the scripts above: the root
  # copies lint this repo, these ship to a generated tenant. Both halves are
  # registered.
  - lib: lint/ruff.toml
    consumer: template/ruff.toml
    reason: Header comments only; the rule selection is the library's.
    reconciled_sha256: ccf4e857a9d7e20039ef8f68be7080210e6703d1400c23586ec6f5679e2fbfb2
  - lib: lint/gitleaks.toml
    consumer: template/.gitleaks.toml
    reason: Allowlist paths and fixture anchors are per-tenant.
    reconciled_sha256: bffbe70c94436f4442aaeecc1f1f5715315fc5908b1486b2198796b9e097ff0d
  - lib: lint/editorconfig
    consumer: template/.editorconfig
    reason: Tenant file-type sections on a shared base.
    reconciled_sha256: 911171d9f26ba0bb47300c97a9e46b078d48eb852dfe9a050fbc3c8e41cc2944
  # Still the root name, unlike the copy above: the vendored GitHub workflow
  # lints with `-c .yamllint`, so this path moves when the library's does.
  - lib: lint/yamllint-relaxed.yml
    consumer: template/.yamllint
    reason: Header comments only; the rules are the library's.
    reconciled_sha256: 7fcb8f02aadf68b97cd334a69a889c8cd87ac4796927c086bf77702a247ae2d5
